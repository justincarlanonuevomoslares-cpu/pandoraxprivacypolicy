<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#101116">
  <title>PandoraX Video</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101116;
      color: #f5f5f7;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      place-items: center;
    }

    main {
      width: min(100%, 960px);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      border-radius: .75rem;
      background: #000;
    }
  </style>
</head>
<body>
  <main>
    <h1>PandoraX Video</h1>
    <video controls playsinline preload="metadata">
      <source src="pandorax-video.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
  </main>
</body>
</html>
